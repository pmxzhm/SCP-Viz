<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCP — Screen / Container / Picture</title>
<style>
:root{
  --bg:#808080;
  --panel:#12161b;
  --panel2:#181d23;
  --line:#2b323a;
  --text:#f4f6f8;
  --muted:#9ba4ae;
  --accent:#8b5cf6;

  /* Canonical SCP visualization colors */
  --screen:#000000;
  --container:#000000;
  --picture:#f97316;
  --screen-label:#ffffff;
  --container-label:#ffffff;
  --picture-label:#111111;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.app{
  width:min(1440px,100%);
  margin:auto;
  padding:24px;
}

header{margin-bottom:20px}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.download-btn{border:1px solid #f97316;background:#f97316;color:#111;border-radius:8px;padding:10px 14px;font-size:13px;font-weight:750;cursor:pointer}
.download-btn:hover{filter:brightness(.94)}
h1{margin:0;font-size:28px;letter-spacing:-.5px}
.subtitle{margin-top:5px;color:var(--muted);font-size:14px}

.layout{
  display:grid;
  grid-template-columns:360px minmax(0,1fr);
  gap:18px;
  align-items:start;
}

.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px;
}

.panel h2{
  font-size:14px;
  margin:0 0 14px;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.fields{display:grid;gap:12px}

.scp-card{
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px;
  background:var(--panel2);
}

.scp-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:9px;
}

.scp-name{font-weight:800}
.scp-def{font-size:11px;color:var(--muted)}

label{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-bottom:6px;
}

.ratio-control{
  display:grid;
  grid-template-columns:32px minmax(0,1fr) 32px;
  gap:5px;
  align-items:center;
}

input[type="text"]{
  width:100%;
  background:#0d1014;
  border:1px solid var(--line);
  border-radius:8px;
  color:var(--text);
  padding:10px 11px;
  outline:none;
  font-size:16px;
  font-weight:650;
  min-width:0;
}

input[type="text"]:focus{border-color:#59616b}
.title-card input[type="text"]{margin-top:0;font-size:14px;font-weight:500}

.step{
  height:38px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#20262d;
  color:#cbd1d7;
  cursor:pointer;
  font-size:11px;
}

.step:hover{background:#2a3139;color:#fff}
.step:active{transform:translateY(1px)}

.container-card[hidden]{display:none}
.color-control{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.color-control label{margin:0}
.color-control select{width:100%;margin-top:6px;background:#0d1014;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px}
.color-swatch{display:inline-block;width:10px;height:10px;border:1px solid #888;border-radius:2px;vertical-align:middle;margin-right:5px}
.mode-control select{width:100%;margin-top:6px;background:#0d1014;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px}

.reset{
  width:100%;
  margin-top:12px;
  padding:10px;
  border:1px solid var(--line);
  background:#20262d;
  color:var(--text);
  border-radius:8px;
  cursor:pointer;
  font-weight:650;
}

.reset:hover{background:#292f37}

.upload{
  margin-top:18px;
  border-top:1px solid var(--line);
  padding-top:18px;
}

input[type=file]{width:100%;font-size:12px;color:var(--muted)}

.stage{
  min-height:650px;
  display:flex;
  flex-direction:column;
}

.stage-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
  margin-bottom:14px;
}

.stats{display:flex;gap:8px;flex-wrap:wrap}

.stat{
  border:1px solid var(--line);
  background:#0d1014;
  border-radius:8px;
  padding:7px 10px;
  font-size:12px;
}

.stat b{color:#fff}

.visual-wrap{
  flex:1;
  min-height:500px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:#808080;
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
}

/* SCP geometry: C is fitted inside S, and P is fitted inside C using the selected boxing mode. */
.screen{
  --layer-label-bg:#000000;
  --layer-label-text:#ffffff;
  position:relative;
  width:min(92%,900px);
  aspect-ratio:var(--screen-ratio);
  background:var(--screen);
  border:0;
  box-shadow:0 12px 28px rgba(0,0,0,.25);
  overflow:hidden;
  flex:0 1 auto;
}

.container{
  position:absolute;
  left:50%;
  top:50%;
  width:var(--container-w);
  height:var(--container-h);
  transform:translate(-50%,-50%);
  background:var(--container);
  border:0;
  overflow:hidden;
}

.picture{
  position:absolute;
  left:50%;
  top:50%;
  width:var(--picture-w);
  height:var(--picture-h);
  transform:translate(-50%,-50%);
  background:var(--picture);
  border:0;
  overflow:hidden;
}

.picture-image{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  display:none;
}

.picture.has-image .picture-image{display:block}

.empty{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:12px;
  font-weight:600;
  letter-spacing:.02em;
  pointer-events:none;
  text-shadow:0 1px 3px rgba(0,0,0,.7);
}

.picture.has-image .empty{display:none}

.caption{
  margin-top:12px;
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}

.logic{
  margin-top:14px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#0d1014;
  font-size:12px;
  color:var(--muted);
  line-height:1.5;
}

.logic b{color:var(--text)}

@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .stage{min-height:560px}
}

@media(max-width:560px){
  .header-row{align-items:flex-start}
  .download-btn{padding:10px 8px}
  .ratio-control{grid-template-columns:28px minmax(0,1fr) 28px}
  .step{height:38px}
  .app{padding:14px}
  .visual-wrap{padding:12px;min-height:400px}
  .stage-top{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="header-row">
      <div><h1>SCP</h1><div class="subtitle">Screen Ratio · Container Ratio · Picture Ratio</div></div>
      <button class="download-btn" id="download" type="button">Download PNG</button>
    </div>
  </header>

  <div class="layout">
    <section class="panel">
      <h2>Variables</h2>

      <div class="fields">
        <div class="scp-card title-card">
          <div class="scp-head"><span class="scp-name">Title</span><span class="scp-def">Export heading</span></div>
          <label for="exportTitle">Title shown on downloaded image</label>
          <input id="exportTitle" type="text" value="" placeholder="Enter movie or visualization title" maxlength="120">
        </div>

        <div class="scp-card">
          <div class="scp-head">
            <span class="scp-name">S</span>
            <span class="scp-def">Screen ratio</span>
          </div>
          <label for="screenRatio">Aspect ratio</label>
          <div class="ratio-control">
            <button class="step" data-target="screenRatio" data-dir="up" aria-label="Increase S">▲</button>
            <input id="screenRatio" type="text" value="2.39:1" inputmode="decimal">
            <button class="step" data-target="screenRatio" data-dir="down" aria-label="Decrease S">▼</button>
          </div>
        </div>

        <div class="scp-card mode-control">
          <div class="scp-head"><span class="scp-name">Boxing Mode</span><span class="scp-def">Presentation fit</span></div>
          <label for="boxingMode">Choose visualization</label>
          <select id="boxingMode">
            <option value="none">No boxing</option>
            <option value="pillar">Pillar boxing</option>
            <option value="letter">Letter boxing</option>
            <option value="window">Window boxing</option>
            <option value="fox">Fox boxing</option>
          </select>
        </div>

        <div class="scp-card">
          <div class="scp-head"><span class="scp-name">Colors</span><span class="scp-def">Black / white</span></div>
          <div class="color-control">
            <label for="screenColor">Screen color
              <select id="screenColor"><option value="#000000" selected>Black</option><option value="#ffffff">White</option></select>
            </label>
            <label for="containerColor">Container color
              <select id="containerColor"><option value="#000000" selected>Black</option><option value="#ffffff">White</option></select>
            </label>
          </div>
        </div>

        <div class="scp-card" id="containerCard">
          <div class="scp-head">
            <span class="scp-name">C</span>
            <span class="scp-def">Container ratio</span>
          </div>
          <label for="containerRatio">Aspect ratio</label>
          <div class="ratio-control">
            <button class="step" data-target="containerRatio" data-dir="up" aria-label="Increase C">▲</button>
            <input id="containerRatio" type="text" value="2.39:1" inputmode="decimal">
            <button class="step" data-target="containerRatio" data-dir="down" aria-label="Decrease C">▼</button>
          </div>
        </div>

        <div class="scp-card">
          <div class="scp-head">
            <span class="scp-name">P</span>
            <span class="scp-def">Picture ratio</span>
          </div>
          <label for="pictureRatio">Aspect ratio</label>
          <div class="ratio-control">
            <button class="step" data-target="pictureRatio" data-dir="up" aria-label="Increase P">▲</button>
            <input id="pictureRatio" type="text" value="2.39:1" inputmode="decimal">
            <button class="step" data-target="pictureRatio" data-dir="down" aria-label="Decrease P">▼</button>
          </div>
        </div>
      </div>

      <button class="reset" id="reset">Reset active ratios to 2.39:1</button>

      <div class="upload">
        <h2>Image</h2>
        <label for="imageUpload">Upload an image to place inside P</label>
        <input id="imageUpload" type="file" accept="image/*">
      </div>
    </section>

    <section class="panel stage">
      <div class="stage-top">
        <h2>Visualization</h2>
        <div class="stats">
          <div class="stat">S <b id="sOut">2.39:1</b></div>
          <div class="stat" id="cStat">C <b id="cOut">2.39:1</b></div>
          <div class="stat">P <b id="pOut">2.39:1</b></div>
        </div>
      </div>

      <div class="visual-wrap">
        <div class="screen" id="screen">
          <div class="container" id="container">
            <div class="picture" id="picture">
              <img class="picture-image" id="pictureImage" alt="">
              <div class="empty">Upload an image</div>
            </div>
          </div>
        </div>
      </div>

      <div class="caption" id="caption"></div>
      <div class="logic" id="logic"></div>
    </section>
  </div>
</div>

<script>
const screenInput = document.getElementById('screenRatio');
const containerInput = document.getElementById('containerRatio');
const pictureInput = document.getElementById('pictureRatio');
const boxingModeInput = document.getElementById('boxingMode');
const screenColorInput = document.getElementById('screenColor');
const containerColorInput = document.getElementById('containerColor');

const screen = document.getElementById('screen');
const container = document.getElementById('container');
const picture = document.getElementById('picture');
const pictureImage = document.getElementById('pictureImage');

const containerCard = document.getElementById('containerCard');
const cStat = document.getElementById('cStat');
const caption = document.getElementById('caption');
const logic = document.getElementById('logic');

const sOut = document.getElementById('sOut');
const cOut = document.getElementById('cOut');
const pOut = document.getElementById('pOut');

function parseRatio(value){
  const raw = String(value).trim().replace(/×/g, ':').replace(/\//g, ':');
  const parts = raw.split(':').map(v => Number(v.trim()));
  if(
    parts.length !== 2 ||
    !Number.isFinite(parts[0]) ||
    !Number.isFinite(parts[1]) ||
    parts[0] <= 0 ||
    parts[1] <= 0
  ) return null;

  return parts[0] / parts[1];
}

function formatRatio(value){
  return Number(value).toFixed(2).replace(/\.00$/,'') + ':1';
}

function stepRatio(id, direction){
  const input = document.getElementById(id);
  const current = parseRatio(input.value);
  if(!current) return;

  let next = current + (direction === 'up' ? 0.01 : -0.01);
  next = Math.max(0.10, Math.round(next * 100) / 100);
  input.value = formatRatio(next);
  update();
}

document.querySelectorAll('.step').forEach(button => {
  button.addEventListener('click', () => {
    stepRatio(button.dataset.target, button.dataset.dir);
  });
});

/*
  Returns the exact percentage rectangle needed to FIT an inner ratio
  completely inside an outer ratio.

  Cases:
  inner > outer  → wider inner → full width, reduced height
  inner = outer  → exact match  → 100% × 100%
  inner < outer  → narrower inner → reduced width, full height

  This single rule covers every wider/equal/narrower permutation.
*/
function containBox(innerRatio, outerRatio){
  if(Math.abs(innerRatio - outerRatio) < 1e-10){
    return { width:100, height:100, relation:'same' };
  }

  if(innerRatio > outerRatio){
    return {
      width:100,
      height:(outerRatio / innerRatio) * 100,
      relation:'wider'
    };
  }

  return {
    width:(innerRatio / outerRatio) * 100,
    height:100,
    relation:'narrower'
  };
}

function applyBox(element, box){
  element.style.width = box.width + '%';
  element.style.height = box.height + '%';
}

function relationText(relation){
  if(relation === 'same') return 'same ratio as';
  if(relation === 'wider') return 'wider than';
  return 'narrower than';
}

function update(){
  const s = parseRatio(screenInput.value);
  const c = parseRatio(containerInput.value);
  const p = parseRatio(pictureInput.value);
  const screenColor = screenColorInput.value;
  const containerColor = containerColorInput.value;
  const mode = boxingModeInput.value;
  const contrast = color => color.toLowerCase() === '#ffffff' ? '#000000' : '#ffffff';
  screen.style.setProperty('--screen', screenColor);
  screen.style.setProperty('--container', containerColor);
  if(s){ screen.style.setProperty('--screen-ratio', s); sOut.textContent = formatRatio(s); }
  if(c) cOut.textContent = formatRatio(c);
  if(p) pOut.textContent = formatRatio(p);
  if(!s || !c || !p) return;

  // Fit the container fully inside the screen.
  const cBox = containBox(c, s);
  applyBox(container, cBox);
  container.style.background = containerColor;

  // Select the classic presentation fit. The picture's own ratio is always preserved.
  const base = containBox(p, c);
  let pBox = {width:base.width, height:base.height, relation:base.relation};
  if(mode === 'pillar'){
    if(p <= c){ pBox = {width:(p/c)*100, height:100, relation:'narrower'}; }
    else { pBox = base; }
  } else if(mode === 'letter'){
    if(p >= c){ pBox = {width:100, height:(c/p)*100, relation:'wider'}; }
    else { pBox = base; }
  } else if(mode === 'window'){
    const scale = 0.82;
    const targetW = 100*scale, targetH = 100*scale;
    const targetRatio = c * targetW / targetH;
    if(p > targetRatio){ pBox = {width:targetW, height:targetW*c/p, relation:p>c?'wider':'narrower'}; }
    else { pBox = {width:targetH*p/c, height:targetH, relation:p>c?'wider':'narrower'}; }
  }
  applyBox(picture, pBox);
  picture.style.background = '#f97316';
  caption.innerHTML = 'Boxing mode: <b>' + boxingModeInput.options[boxingModeInput.selectedIndex].text + '</b>. The presentation remains centered and its aspect ratio is preserved.';
  const modeDescription = mode === 'pillar' ? 'vertical side bars when the presentation is narrower than the container' : mode === 'letter' ? 'horizontal bars when the presentation is wider than the container' : 'both horizontal and vertical surrounding space around a smaller presentation';
  logic.innerHTML = '<b>Current logic:</b> C is ' + relationText(cBox.relation) + ' S; P is ' + relationText(pBox.relation) + ' C. This mode emphasizes ' + modeDescription + '. No aspect-ratio stretching is applied.';
}

[screenInput, containerInput, pictureInput].forEach(input => {
  input.addEventListener('input', update);
  input.addEventListener('change', update);
  input.addEventListener('blur', () => {
    const value = parseRatio(input.value);
    if(value) input.value = formatRatio(value);
  });
});

boxingModeInput.addEventListener('change', update);
screenColorInput.addEventListener('change', update);
containerColorInput.addEventListener('change', update);

document.getElementById('reset').addEventListener('click', () => {
  screenInput.value = '2.39:1';
  containerInput.value = '2.39:1';
  pictureInput.value = '2.39:1';
  update();
});

document.getElementById('imageUpload').addEventListener('change', event => {
  const file = event.target.files[0];
  if(!file) return;

  const url = URL.createObjectURL(file);
  pictureImage.onload = () => URL.revokeObjectURL(url);
  pictureImage.src = url;
  picture.classList.add('has-image');
});

  await Promise.all([xIcon.decode().catch(()=>{}), instagramIcon.decode().catch(()=>{})]);
  const canvas = document.createElement('canvas');
  canvas.width = 1800; canvas.height = 1200;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#808080'; ctx.fillRect(0,0,canvas.width,canvas.height);

  // Header and footer are intentionally kept separate from the visualization.
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 34px system-ui, sans-serif';
  const iconSize=34, iconGap=12;
  const headingWidth=ctx.measureText(heading).width;
  const groupWidth=headingWidth;
  const groupX=(canvas.width-groupWidth)/2;
  ctx.textAlign='left';
  ctx.fillText(heading, groupX, 54, canvas.width-100);
  const iconY=54-iconSize/2;
  // Header text explicitly names the X handle; no extra social icons are appended.
  ctx.textAlign='center';

  const maxW = 1500, maxH = 900;
  let sw = maxW, sh = sw / s;
  if(sh > maxH){ sh = maxH; sw = sh * s; }
  const cBox = containBox(c,s);
  const cw = sw*cBox.width/100, ch = sh*cBox.height/100;
  const pwBase = containBox(p,c);
  let pBox = {width:pwBase.width,height:pwBase.height,relation:pwBase.relation};
  if(mode==='pillar' && p<=c) pBox={width:(p/c)*100,height:100,relation:'narrower'};
  else if(mode==='letter' && p>=c) pBox={width:100,height:(c/p)*100,relation:'wider'};
  else if(mode==='window' || mode==='fox'){
    const scale = mode==='fox' ? .68 : .82, targetW=100*scale, targetH=100*scale, targetRatio=c*targetW/targetH;
    pBox = p>targetRatio ? {width:targetW,height:targetW*c/p} : {width:targetH*p/c,height:targetH};
  }
  const pw=cw*pBox.width/100, ph=ch*pBox.height/100;
  const rx=(canvas.width-sw)/2, ry=120+(maxH-sh)/2;
  const rcx=rx+(sw-cw)/2, rcy=ry+(sh-ch)/2;
  const rpx=rcx+(cw-pw)/2, rpy=rcy+(ch-ph)/2;
  const screenColor=screenColorInput.value, containerColor=containerColorInput.value;
  ctx.fillStyle=screenColor; ctx.fillRect(rx,ry,sw,sh);
  ctx.fillStyle=containerColor; ctx.fillRect(rcx,rcy,cw,ch);
  ctx.fillStyle='#f97316'; ctx.fillRect(rpx,rpy,pw,ph);
  if(pictureImage.complete && pictureImage.naturalWidth && picture.classList.contains('has-image')){
    ctx.save(); ctx.beginPath(); ctx.rect(rpx,rpy,pw,ph); ctx.clip(); ctx.drawImage(pictureImage,rpx,rpy,pw,ph); ctx.restore();
  }

  const footerParts = [
    `S ${formatRatio(s)}`,
    `C ${formatRatio(c)}`,
    `P ${formatRatio(p)}`
  ];
  if(mode && mode!=='none') footerParts.push(modeLabel);
  const footer = footerParts.join('  |  ');
  ctx.fillStyle = '#ffffff';
  ctx.font = '600 25px system-ui, sans-serif';
  ctx.fillText(footer, canvas.width/2, 1150, canvas.width-100);

  const safeTitle = (exportTitle || 'Visualization').replace(/[^a-z0-9-_]+/gi,'_').replace(/^_+|_+$/g,'');
  const boxingName = mode && mode!=='none' ? `__${mode.toUpperCase()}-BOXING` : '';
  const naming=`S-${formatRatio(s).replace(':','-')}__C-${formatRatio(c).replace(':','-')}__P-${formatRatio(p).replace(':','-')}${boxingName}`;
  const link=document.createElement('a');
  link.download=`SCP_${safeTitle}_${naming}.png`;
  link.href=canvas.toDataURL('image/png'); link.click();
}
document.getElementById('download').addEventListener('click', downloadVisualization);
